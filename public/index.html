<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12261c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Euchre</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🃏</text></svg>">
</head>
<body>

<!-- ------------------------------------------------------------ join -->
<section id="join" class="screen">
  <div class="join-card">
    <h1>Euchre</h1>
    <p class="tagline">Two of you, two bots, ten points.</p>

    <label for="name">Your name</label>
    <input id="name" maxlength="14" autocomplete="nickname" placeholder="Dan">

    <button id="create" class="primary">Start a new game</button>

    <div class="divider"><span>or</span></div>

    <label for="code">Join with a code</label>
    <div class="row">
      <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off"
             spellcheck="false" placeholder="ABCD">
      <button id="join-btn">Join</button>
    </div>

    <p id="join-error" class="error" hidden></p>
  </div>
</section>

<!-- ----------------------------------------------------------- lobby -->
<section id="lobby" class="screen" hidden>
  <div class="join-card">
    <h2>Waiting for your opponent</h2>
    <p class="tagline">Send them this code — or the link.</p>
    <div id="room-code" class="room-code">····</div>
    <button id="copy-link" class="primary">Copy invite link</button>
    <p id="lobby-status" class="tagline"></p>
  </div>
</section>

<!-- ------------------------------------------------------------ game -->
<section id="game" class="screen" hidden>

  <header id="hud">
    <div class="score" id="score-us"><span class="label">You</span><span class="value">0</span></div>
    <div id="trump-badge" class="trump-badge" hidden>
      <span class="t-label">Trump</span>
      <span class="t-suit"></span>
    </div>
    <div class="score them" id="score-them"><span class="label">Them</span><span class="value">0</span></div>
    <button id="menu-btn" class="icon-btn" aria-label="Menu">⋯</button>
  </header>

  <div id="table">
    <div class="seat top"><div class="tag"></div><div class="backs"></div></div>
    <div class="seat left"><div class="tag"></div><div class="backs"></div></div>
    <div class="seat right"><div class="tag"></div><div class="backs"></div></div>
    <div class="seat bottom"><div class="tag"></div></div>

    <div id="trick-area">
      <div class="tslot top"></div>
      <div class="tslot left"></div>
      <div class="tslot right"></div>
      <div class="tslot bottom"></div>
      <div id="upcard-area" hidden>
        <div class="mini-label">Turned up</div>
        <div id="upcard"></div>
      </div>
    </div>
    <div id="trick-note"></div>
  </div>

  <div id="prompt" class="prompt"></div>

  <!-- bidding controls -->
  <div id="bid-panel" class="panel" hidden>
    <div id="bid-suits" class="bid-suits"></div>
    <label class="alone-toggle">
      <input type="checkbox" id="alone"> <span>Go alone</span>
    </label>
    <div class="bid-actions">
      <button id="bid-pass" class="ghost">Pass</button>
      <button id="bid-order" class="primary"></button>
    </div>
  </div>

  <div id="hand" class="hand"></div>

  <!-- overlays -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="ov-title"></h2>
      <p id="ov-body"></p>
      <div id="ov-tricks" class="ov-tricks"></div>
      <button id="ov-btn" class="primary"></button>
    </div>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <strong>Game</strong>
      <button id="drawer-close" class="icon-btn">✕</button>
    </div>
    <div class="drawer-meta">
      Room <b id="drawer-room"></b> · <span id="drawer-conn"></span>
    </div>
    <div id="log" class="log"></div>
    <div id="chat" class="chat"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" maxlength="200" placeholder="Say something…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <div id="conn-banner" class="conn-banner" hidden>Reconnecting…</div>
</section>

<script src="app.js"></script>
</body>
</html>
